<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171717" />
    <title>HDU Chat</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section id="identity-view" class="identity-view" aria-labelledby="identity-title">
        <div class="identity-shell">
          <div class="identity-intro">
            <div class="brand-lockup">
              <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img">
                  <path d="M7.4 5.25A7.9 7.9 0 0 1 20 11.6c0 4.6-3.7 8.15-8.35 8.15a9.6 9.6 0 0 1-3.05-.5L4 20.6l1.45-4A7.75 7.75 0 0 1 4 12.1c0-1.4.37-2.72 1.02-3.85" />
                  <path d="M8.25 11.8h.01M12 11.8h.01M15.75 11.8h.01" />
                </svg>
              </span>
              <span>HDU Chat</span>
            </div>
            <div class="intro-copy">
              <p class="intro-kicker">关注心情的 AI 聊天伙伴</p>
              <h1>聊聊此刻，<br />回应心情。</h1>
              <p>和小禾聊聊日常，分享此刻的心情。结合对话与情绪，给你自然、贴心的回应。聊天记录会保留，下次回来还能接着聊。</p>
            </div>
            <div class="intro-note">
              <span class="online-dot" aria-hidden="true"></span>
              服务已就绪
            </div>
          </div>

          <div class="identity-panel">
            <div class="mobile-brand brand-lockup">
              <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img">
                  <path d="M7.4 5.25A7.9 7.9 0 0 1 20 11.6c0 4.6-3.7 8.15-8.35 8.15a9.6 9.6 0 0 1-3.05-.5L4 20.6l1.45-4A7.75 7.75 0 0 1 4 12.1c0-1.4.37-2.72 1.02-3.85" />
                  <path d="M8.25 11.8h.01M12 11.8h.01M15.75 11.8h.01" />
                </svg>
              </span>
              <span>HDU Chat</span>
            </div>
            <div class="panel">
              <div class="panel-heading">
                <span class="panel-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z" /></svg>
                </span>
                <div>
                  <h2 id="identity-title">欢迎回来</h2>
                  <p>输入用户标识，继续你的专属对话。</p>
                </div>
              </div>
              <form id="identity-form">
                <label for="identifier-input">用户标识</label>
                <div class="input-wrap">
                  <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z" /></svg>
                  <input id="identifier-input" name="identifier" type="text" maxlength="128" required autocomplete="username" aria-describedby="identity-status" placeholder="例如：alice" />
                </div>
                <button id="enter-chat" class="primary-button" type="submit">
                  <span>进入聊天</span>
                  <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></svg>
                </button>
              </form>
              <p id="identity-status" class="status identity-status" role="status" aria-live="polite"></p>
              <p class="privacy-note">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 10V7a5 5 0 0 1 10 0v3M5 10h14v11H5z" /></svg>
                你的聊天记录将按用户独立保存
              </p>
            </div>
          </div>
        </div>
      </section>

      <section id="chat-view" class="chat-view" aria-labelledby="chat-title" hidden>
        <aside class="chat-sidebar" aria-label="聊天导航">
          <div class="sidebar-top">
            <div class="brand-lockup sidebar-brand">
              <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img">
                  <path d="M7.4 5.25A7.9 7.9 0 0 1 20 11.6c0 4.6-3.7 8.15-8.35 8.15a9.6 9.6 0 0 1-3.05-.5L4 20.6l1.45-4A7.75 7.75 0 0 1 4 12.1c0-1.4.37-2.72 1.02-3.85" />
                  <path d="M8.25 11.8h.01M12 11.8h.01M15.75 11.8h.01" />
                </svg>
              </span>
              <span>HDU Chat</span>
            </div>
            <div class="sidebar-section">
              <p class="sidebar-label">对话</p>
              <div class="conversation-item" aria-current="page">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z" /></svg>
                <span>当前对话</span>
              </div>
            </div>
          </div>
          <div class="sidebar-user">
            <span class="user-avatar" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z" /></svg>
            </span>
            <div class="user-meta">
              <span id="current-identifier"></span>
              <small>当前用户</small>
            </div>
            <button id="switch-user" class="icon-button" type="button" aria-label="切换用户" title="切换用户">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 18H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" /></svg>
            </button>
          </div>
        </aside>

        <div class="chat-main">
          <header class="chat-header">
            <div>
              <p class="eyebrow">智能助手</p>
              <h1 id="chat-title">新对话</h1>
            </div>
            <div id="emotion-badge" class="emotion-badge" role="status" aria-live="polite" data-state="empty">
              <span class="emotion-orbit" aria-hidden="true">✧</span>
              <div class="emotion-badge-copy">
                <div class="emotion-badge-heading"><span>情绪状态</span><strong id="emotion-label">尚未识别</strong></div>
                <span id="emotion-meta">随对话按需分析</span>
              </div>
            </div>
          </header>

          <div id="conversation-stage" class="conversation-stage" tabindex="0" role="region" aria-label="对话记录">
            <p id="chat-status" class="status chat-status" role="status" aria-live="polite"></p>
            <ol id="message-list" class="message-list" aria-label="聊天消息"></ol>
          </div>

          <div class="composer-area">
            <form id="message-form" class="message-form">
              <label class="sr-only" for="message-input">消息</label>
              <textarea id="message-input" name="message" rows="2" required aria-describedby="chat-status" placeholder="输入消息，Enter 换行，Ctrl/⌘+Enter 发送"></textarea>
              <div class="composer-footer">
                <span>AI 生成的内容可能不准确，请核实重要信息。</span>
                <button id="send-message" class="send-button" type="submit" aria-label="发送消息">
                  <span>发送</span>
                  <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z" /><path d="M22 2 11 13" /></svg>
                </button>
              </div>
            </form>
          </div>
        </div>
      </section>
    </main>
    <script src="/static/presentation.js" defer></script>
    <script src="/static/app.js" defer></script>
  </body>
</html>
